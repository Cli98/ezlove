services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezlove
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # 时间口径契约（utils/datetime.py）：naive 本地时间直比，容器必须与业务时区一致
      TZ: Asia/Shanghai
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  admin-frontend:
    build: ./admin-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
